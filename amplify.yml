version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd apps/qr-attendance/frontend
        - npm ci
    build:
      commands:
        - cd apps/qr-attendance/frontend
        - npm run build
  artifacts:
    baseDirectory: apps/qr-attendance/frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - apps/qr-attendance/frontend/.next/cache/**/*
      - apps/qr-attendance/frontend/node_modules/**/*
